# Coolify deploy: API + PostgreSQL. SERVICE_* values are generated by Coolify.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: license_user
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: theme_license
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U license_user -d theme_license"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVICE_FQDN_APP_8080: ""
      DATABASE_URL: postgres://license_user:${SERVICE_PASSWORD_POSTGRES}@db:5432/theme_license
      ADMIN_TOKEN: ${SERVICE_PASSWORD_64_ADMIN}
      ADMIN_ALLOWED_ORIGINS: ${ADMIN_ALLOWED_ORIGINS:-}

volumes:
  pgdata:
